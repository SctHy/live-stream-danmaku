x-gateway: &gateway
  profiles: ["cluster"]
  image: maku-gateway:local
  command: ["-host", "0.0.0.0", "-port", "8080"]
  environment:
    REDIS_ADDR: redis:6379
    KAFKA_BROKERS: kafka:29092
    DATABASE_URL: postgres://danmaku:danmaku@postgres:5432/danmaku_db?sslmode=disable
    DANMAKU_MOD_ROOM: "${DANMAKU_MOD_ROOM:-}"
    DANMAKU_MOD_TOKEN: "${DANMAKU_MOD_TOKEN:-}"
  stop_signal: SIGTERM
  stop_grace_period: 40s
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
    interval: 2s
    timeout: 2s
    retries: 15
    start_period: 5s
  depends_on:
    redis: { condition: service_healthy }
    kafka: { condition: service_started }
  restart: unless-stopped

services:
  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  # 1. Redis: broadcast among servers
  redis:
    image: redis:7.4.12-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    restart: always

  # 2. PostgreSQL: persistent danmaku history
  postgres:
    image: postgres:17-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U danmaku -d danmaku_db"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s
    environment:
      POSTGRES_USER: danmaku
      POSTGRES_PASSWORD: danmaku
      POSTGRES_DB: danmaku_db
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data

  archiver:
    profiles: ["cluster"]
    build: { context: ., target: archiver }
    image: maku-archiver:local
    command: ["-metrics-addr", "0.0.0.0:9091"]
    environment:
      DATABASE_URL: postgres://danmaku:danmaku@postgres:5432/danmaku_db?sslmode=disable
      KAFKA_BROKERS: kafka:29092
    ports: ["127.0.0.1:${ARCHIVER_METRICS_PORT:-9091}:9091"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }
    restart: unless-stopped

  gateway-a:
    <<: *gateway
    build: { context: ., target: gateway }
    ports: ["127.0.0.1:${GATEWAY_A_PORT:-8081}:8080"]

  gateway-b:
    <<: *gateway
    pull_policy: never
    ports: ["127.0.0.1:${GATEWAY_B_PORT:-8082}:8080"]

  nginx:
    profiles: ["cluster"]
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:${NGINX_PORT:-8080}:80"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on:
      gateway-a: { condition: service_healthy }
      gateway-b: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 5s
      timeout: 2s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  kafka_data:
