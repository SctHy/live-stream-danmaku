global:
  scrape_interval: 15s

scrape_configs:
  - job_name: maku-gateway
    static_configs:
      # 集群模式下，将下一行替换为下方注释中的双网关地址。
      - targets: ["host.docker.internal:8080"]
      # - targets: ["gateway-a:8080", "gateway-b:8080"]
  # 启用 Archiver 管理端口后，取消以下注释，并确保容器可访问该地址。
  # - job_name: maku-archiver
  #   static_configs:
  #     - targets: ["host.docker.internal:9091"]
  # 集群模式下，启用上述归档任务并将目标替换为 archiver:9091。
