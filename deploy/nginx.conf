worker_processes auto;

events {
    worker_connections 4096;
}

http {
    server_tokens off;
    log_format cluster '$remote_addr "$request" upstream=$upstream_addr '
                       'upstream_status=$upstream_status status=$status '
                       'bytes=$body_bytes_sent request_time=$request_time';
    access_log /var/log/nginx/access.log cluster;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    upstream maku_gateways {
        zone maku_gateways 64k;
        resolver 127.0.0.11 valid=5s ipv6=off;
        least_conn;
        server gateway-a:8080 resolve max_fails=1 fail_timeout=5s;
        server gateway-b:8080 resolve max_fails=1 fail_timeout=5s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location ^~ /internal/ { return 403; }

        location ^~ /hls/ {
            resolver 127.0.0.11 valid=5s ipv6=off;
            set $media mediamtx:8888;
            rewrite ^/hls/(.*)$ /$1 break;
            proxy_pass http://$media;
            absolute_redirect off;
            proxy_redirect ~^(/live/.*)$ /hls$1;
            proxy_cookie_path /live/ /hls/live/;
            proxy_buffering off;
        }

        location = /metrics {
            return 403;
        }

        location ~ ^/api/rooms/[^/]+/[^/]+/live$ {
            proxy_pass http://maku_gateways;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 60s;
            proxy_buffering off;
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }

        location / {
            proxy_pass http://maku_gateways;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
