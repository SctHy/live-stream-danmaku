<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maku · 弹幕放映室</title>
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/room.ts"></script>
  </head>
  <body>
    <header>
      <div class="bar">
        <a class="brand" href="/"><i aria-hidden="true"></i>Maku</a>
        <form id="join">
          <label>房间<input name="room" title="房间名或 B 站直播间号" required maxlength="24" pattern="[a-zA-Z0-9_\-]+" /></label>
          <label>场次<input name="session" required maxlength="24" pattern="[a-zA-Z0-9_\-]+" /></label>
          <button>进入房间</button>
        </form>
        <div class="badges">
          <span id="connection" data-state="connecting" role="status">连接中</span>
          <span id="stats">在线 — · 赞 —</span>
        </div>
      </div>
    </header>
    <main>
      <h1>弹幕放映室</h1>
      <div class="layout">
        <section class="player" aria-label="放映区">
          <div class="screen">
            <video id="video" hidden muted controls playsinline preload="auto"></video>
            <canvas id="overlay" aria-hidden="true"></canvas>
          </div>
          <div class="toolbar">
            <span id="source-status" role="status">本地弹幕</span>
            <label class="live-switch" hidden><input id="live-comments" type="checkbox" role="switch" checked />B 站弹幕</label>
            <button id="fullscreen" type="button">全屏</button>
          </div>
          <details id="settings">
            <summary>弹幕设置</summary>
            <div class="fields"></div>
          </details>
          <div class="composer">
            <form id="compose">
              <input id="message" maxlength="500" required autocomplete="off" aria-label="弹幕内容" placeholder="写一条弹幕…" disabled />
              <button id="send" disabled>发送</button>
              <button type="button" id="like" disabled>赞 +1</button>
            </form>
            <button type="button" id="retry" hidden>重试上一条</button>
            <p id="feedback" role="status"></p>
          </div>
        </section>
        <aside aria-labelledby="heading">
          <h2 id="heading">实时弹幕</h2>
          <ol id="messages"></ol>
          <details id="moderation-panel">
            <summary>房管操作</summary>
            <form id="moderation">
              <label>房管密钥<input id="modKey" type="password" autocomplete="off" required /></label>
              <label>弹幕<select id="target" required><option value="">选择一条弹幕</option></select></label>
              <div><button value="withdraw">撤回</button> <button value="mute">禁言 60 秒</button></div>
            </form>
          </details>
        </aside>
      </div>
    </main>
  </body>
</html>
