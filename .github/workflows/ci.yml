name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check Go formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./cmd/gateway ./cmd/archiver ./cmd/bench

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Type-check and build frontend
        working-directory: frontend
        run: npm ci && npx tsc --noEmit && npm run build
      - name: Verify embedded assets
        run: |
          git diff --exit-code -- internal/httpapi/web
          test -z "$(git ls-files --others --exclude-standard -- internal/httpapi/web)"

  integration:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 2s --health-retries 15
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: danmaku
          POSTGRES_PASSWORD: danmaku
          POSTGRES_DB: danmaku_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U danmaku -d danmaku_db"
          --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      DANMAKU_TEST_REDIS_ADDR: 127.0.0.1:6379
      DANMAKU_TEST_DATABASE_URL: postgres://danmaku:danmaku@127.0.0.1:5432/danmaku_db?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 -timeout=15m -v ./...
